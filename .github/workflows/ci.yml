name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (tsc --checkJs)
        run: npm run typecheck
      - name: Unitarias (Vitest)
        run: npm test
  e2e:
    # 20 juegos: la suite de escritorio se reparte en 6 runners en paralelo (1 worker cada uno)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E escritorio (parte ${{ matrix.shard }}/6)
        run: npx playwright test --project=desktop --grep-invert "ciclo de vida" --shard=${{ matrix.shard }}/6
        env:
          ML_WORKERS: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
