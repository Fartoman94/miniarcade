name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (tsc --checkJs)
        run: npm run typecheck
      - name: Unitarias (Vitest)
        run: npm test
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E portal + navegación + juegos (escritorio)
        run: npx playwright test --project=desktop
        env:
          ML_WORKERS: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
